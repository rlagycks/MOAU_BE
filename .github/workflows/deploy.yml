name: Deploy
on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  IMAGE: ghcr.io/rlagycks/moau_be:latest
  GHCR_TOKEN_PARAMETER_NAME: "github-ghcr-token"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::788391084087:role/Moau-OCID
          aws-region: ${{ env.AWS_REGION }}

      - name: Find target EC2 by tag Name=MOAU
        id: ec2
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=MOAU" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "No running instance with tag Name=MOAU" >&2
            exit 1
          fi
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Deploy via SSM Run Command
        run: |
          aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "MOAU deploy" \
            --parameters commands='[
              "set -e",
              "sudo mkdir -p /srv/moau && sudo chown $USER:$USER /srv/moau",
              "cd /srv/moau",

              "# --- .env 생성 ---",
              "cat > .env <<\"ENV\"",
              "SPRING_PROFILES_ACTIVE=prod",
          
              "# --- RDS ---",
              "RDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }}",
              "RDS_DB=${{ secrets.RDS_DB }}",
              "RDS_USER=${{ secrets.RDS_USER }}",
              "RDS_PASS=${{ secrets.RDS_PASS }}",
          
              "# --- AWS ---",
              "AWS_REGION=${{ secrets.AWS_REGION }}",
              "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}",
          
              "# --- JWT  ---",
              "SPRING_SECURITY_JWT_SECRET=${{ secrets.JWT_SECRET }}",
              "SPRING_SECURITY_JWT_ACCESSTOKENEXPIRATIONMSEC=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION_MSEC }}",
              "SPRING_SECURITY_JWT_REFRESHTOKENEXPIRATIONMSEC=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_MSEC }}",
          
              "# --- Kakao  ---",
              "APP_KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}",
              "APP_KAKAO_TOKEN_URI=${{ secrets.KAKAO_TOKEN_URI }}",
              "APP_KAKAO_USER_ME_URI=${{ secrets.KAKAO_USER_ME_URI }}",
              "APP_KAKAO_REDIRECT_URIS_0=${{ secrets.KAKAO_REDIRECT_URIS }}",
              "ENV",

              "# --- compose 파일 (매번 덮어쓰기) ---",
              "cat > docker-compose.yml <<\"YAML\"",
              "services:",
              "  app:",
              "    image: ${{ env.IMAGE }}",
              "    container_name: moau-app",
              "    restart: unless-stopped",
              "    ports: [\"80:8080\"]",
              "    env_file: [.env]",
              "    healthcheck:",
              "      test: [\"CMD\", \"wget\", \"-qO-\", \"http://localhost:8080/actuator/health\"]",
              "      interval: 20s",
              "      timeout: 5s",
              "      retries: 10",
              "YAML",

              "aws ssm get-parameter --name ${{ env.GHCR_TOKEN_PARAMETER_NAME }} --with-decryption --query Parameter.Value --output text | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin",
          
              "sudo docker compose pull",
              "sudo docker compose up -d",
              "sudo docker image prune -f"
            ]' \
            --output text