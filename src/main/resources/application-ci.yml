spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${CI_DB_USER}
    password: ${CI_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  security:
    jwt:
      secret: ${CI_JWT_SECRET}
      access-token-expiration-msec: 900000
      refresh-token-expiration-msec: 1209600000

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}

app:
  kakao:
    rest-api-key: ${CI_KAKAO_KEY}
    token-uri: https://kauth.kakao.com/oauth/token
    user-me-uri: https://kapi.kakao.com/v2/user/me
    redirect-uris:
      - "kakao9ec4a4d46982a8f4d7b19fcc7099c63c://oauth"

  naver:
    ocr:
      api-url: ${APP_NAVER_OCR_API_URL}
      secret-key: ${APP_NAVER_OCR_SECRET_KEY}

  openai:
    api-key: ${APP_OPENAI_API_KEY}